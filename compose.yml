services:
  server:
    build:
      context: ./server
    expose:
      - "3000"
  
  dashboard:
    build:
      context: ./dashboard
    expose:
      - "80"
  
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
      - dashboard